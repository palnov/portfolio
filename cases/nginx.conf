server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Coolify normally strips /cases before forwarding.  These routes also
    # make the image work if prefix stripping is disabled later.
    location = / {
        return 302 /cases/aura/;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /cases {
        return 301 /cases/;
    }

    location = /cases/ {
        return 302 /cases/aura/;
    }

    location ~ ^/cases/([^/]+)$ {
        return 301 /cases/$1/;
    }

    location ^~ /cases/ {
        rewrite ^/cases/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
    }

    # When Coolify strips the configured /cases prefix, keep redirects for a
    # missing trailing slash on the public URL instead of leaking /aura/.
    location ~ ^/(residence|aura|buro|bakery|brewdom|glamping|dentist|aion|bfl|adventure|detailing|materia)$ {
        return 301 /cases/$1/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Case pages are intentionally embedded by the portfolio preview modal.
    # Do not emit X-Frame-Options: DENY; allow only the portfolio origin.
    add_header Content-Security-Policy "frame-ancestors 'self' https://palnov.ru" always;
    add_header X-Content-Type-Options "nosniff" always;
}
